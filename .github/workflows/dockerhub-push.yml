name: Build and Push Hardened WordPress Image

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Dockerfile.hardened'      # only runs when the Dockerfile changes
  workflow_dispatch:               # allows manual trigger

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push hardened image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.hardened
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/wordpress-hardened:latest
