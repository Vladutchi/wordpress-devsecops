name: WordPress Security Scan

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  wpscan:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # required to push scan results back to the repo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Docker network
        run: docker network create wp-net

      - name: Start MySQL container
        run: |
          docker run -d --name wp-db --network wp-net \
            -e MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            -e MYSQL_DATABASE="${{ secrets.MYSQL_DATABASE }}" \
            -e MYSQL_USER="${{ secrets.MYSQL_USER }}" \
            -e MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            mysql:5.7

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if docker exec wp-db mysqladmin ping -h localhost --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 5
          done
          echo "MySQL failed to start" && exit 1

      - name: Start WordPress container (vulnerable version)
        run: |
          docker run -d --name wp-site --network wp-net \
            -e WORDPRESS_DB_HOST=wp-db:3306 \
            -e WORDPRESS_DB_USER="${{ secrets.MYSQL_USER }}" \
            -e WORDPRESS_DB_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            -e WORDPRESS_DB_NAME="${{ secrets.MYSQL_DATABASE }}" \
            -p 8080:80 \
            wordpress:5.8

      - name: Install WordPress using wp-cli
        run: |
          docker exec wp-site curl -s -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          docker exec wp-site chmod +x wp-cli.phar
          docker exec wp-site php wp-cli.phar core install \
            --url="http://localhost:8080" \
            --title="Test Site" \
            --admin_user="${{ secrets.WP_ADMIN_USER }}" \
            --admin_password="${{ secrets.WP_ADMIN_PASSWORD }}" \
            --admin_email="admin@example.com" \
            --allow-root

      - name: Verify WordPress is running
        run: |
          docker ps | grep wp-site || (docker logs wp-site && exit 1)
          curl -s -f http://localhost:8080 | head -20 || (echo "WordPress not reachable" && exit 1)

      - name: Prepare scans directory
        run: |
          mkdir -p ${{ github.workspace }}/scans
          chmod 777 ${{ github.workspace }}/scans

      - name: Run WPScan
        run: |
          set +e
          docker run --rm --network host \
            wpscanteam/wpscan \
            --url http://localhost:8080 \
            --enumerate u,vp,vt \
            --api-token "${{ secrets.WPSCAN_API_TOKEN }}" \
            --format json \
            --no-banner > ${{ github.workspace }}/scans/scan-result.json 2> ${{ github.workspace }}/scans/wpscan-errors.log
          EXIT_CODE=$?
          echo "WPScan exit code: $EXIT_CODE"
          echo "$EXIT_CODE" > ${{ github.workspace }}/scans/scan-exit-code.txt
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 5 ]; then
            echo "WPScan encountered a fatal error. Exiting."
            exit $EXIT_CODE
          fi
          echo "WPScan completed (scan may contain vulnerabilities)"
          set -e

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpscan-report
          path: |
            scans/scan-result.json
            scans/scan-exit-code.txt
            scans/wpscan-errors.log

      - name: Commit scan results to repository
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add scans/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Automated WPScan report [exit code $(cat scans/scan-exit-code.txt)]"
            git push
          fi

      - name: Fail if vulnerabilities found
        run: |
          EXIT_CODE=$(cat scans/scan-exit-code.txt)
          echo "WPScan exit code was: $EXIT_CODE"
          if [ "$EXIT_CODE" -eq 5 ]; then
            echo "Vulnerabilities detected by WPScan. Pipeline blocked."
            exit 1
          fi
          echo "No vulnerabilities found. Scan passed."
