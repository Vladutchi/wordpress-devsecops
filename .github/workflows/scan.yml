name: WordPress Security Scan

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  wpscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Docker network
        run: docker network create wp-net

      - name: Start MySQL container
        run: |
          docker run -d --name wp-db --network wp-net \
            -e MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            -e MYSQL_DATABASE="${{ secrets.MYSQL_DATABASE }}" \
            -e MYSQL_USER="${{ secrets.MYSQL_USER }}" \
            -e MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            mysql:5.7

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if docker exec wp-db mysqladmin ping -h localhost --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 5
          done
          echo "MySQL failed to start" && exit 1

      - name: Start WordPress container (vulnerable version)
        run: |
          docker run -d --name wp-site --network wp-net \
            -e WORDPRESS_DB_HOST=wp-db:3306 \
            -e WORDPRESS_DB_USER="${{ secrets.MYSQL_USER }}" \
            -e WORDPRESS_DB_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            -e WORDPRESS_DB_NAME="${{ secrets.MYSQL_DATABASE }}" \
            -p 8080:80 \
            wordpress:5.8

      - name: Install WordPress using wp-cli
        run: |
          # Download wp-cli inside the container
          docker exec wp-site curl -s -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          docker exec wp-site chmod +x wp-cli.phar
          # Install WordPress (allow root because container runs as root by default)
          docker exec wp-site php wp-cli.phar core install \
            --url="http://localhost:8080" \
            --title="Test Site" \
            --admin_user="${{ secrets.WP_ADMIN_USER }}" \
            --admin_password="${{ secrets.WP_ADMIN_PASSWORD }}" \
            --admin_email="admin@example.com" \
            --allow-root

      - name: Verify WordPress is running
        run: |
          docker ps | grep wp-site || (docker logs wp-site && exit 1)
          curl -s -f http://localhost:8080 | head -20 || (echo "WordPress not reachable" && exit 1)

      - name: Prepare scans directory
        run: |
          mkdir -p ${{ github.workspace }}/scans
          chmod 777 ${{ github.workspace }}/scans

      - name: Run WPScan (allow vulnerabilities found - exit code 5)
        run: |
          set +e
          # JSON output to scan-result.json, stderr to a separate log
          docker run --rm --network host \
            wpscanteam/wpscan \
            --url http://localhost:8080 \
            --enumerate u,vp,vt \
            --api-token "${{ secrets.WPSCAN_API_TOKEN }}" \
            --format json \
            --no-banner > ${{ github.workspace }}/scans/scan-result.json 2> ${{ github.workspace }}/scans/wpscan-errors.log
          EXIT_CODE=$?
          echo "WPScan exit code: $EXIT_CODE"
          # Show any warnings from stderr (helps debugging without breaking JSON)
          if [ -s ${{ github.workspace }}/scans/wpscan-errors.log ]; then
            echo "WPScan stderr output:"
            cat ${{ github.workspace }}/scans/wpscan-errors.log
          fi
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 5 ]; then
            echo "WPScan encountered a fatal error. Exiting."
            exit $EXIT_CODE
          fi
          echo "WPScan completed successfully (scan may contain vulnerabilities)"
          set -e

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpscan-report
          path: scans/scan-result.json

      - name: Fail if critical vulnerabilities found
        run: |
          if [ ! -f scans/scan-result.json ]; then
            echo "No scan result file found. Possibly WPScan failed."
            exit 1
          fi
          # Validate that the file is valid JSON
          if ! jq empty scans/scan-result.json 2>/dev/null; then
            echo "scan-result.json is not valid JSON. First 20 lines:"
            head -20 scans/scan-result.json
            exit 1
          fi
          # Count all objects with "severity": "critical" inside the vulnerabilities section
          CRITICAL_COUNT=$(jq '[.vulnerabilities | .. | objects | select(.severity == "critical")] | length' scans/scan-result.json)
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "Critical vulnerabilities detected: $CRITICAL_COUNT"
            jq '[.vulnerabilities | .. | objects | select(.severity == "critical")] | .[] | {title, fixed_in}' scans/scan-result.json
            exit 1
          fi
          echo "No critical vulnerabilities found. Scan passed."
