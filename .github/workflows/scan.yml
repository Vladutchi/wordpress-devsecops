name: WordPress WPScan – beware of the miss-configs!!!
#####
on:
  push:
    branches:
      - main
jobs:
  wordpress-wpscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (required even if no repo code is used)
        uses: actions/checkout@v4

      - name: Set up Docker environment
        run: |
          sudo systemctl start docker
          docker version

      - name: Start MySQL container
        run: |
          docker run -d --name wp-db \
            -e MYSQL_ROOT_PASSWORD=password \
            -e MYSQL_DATABASE=wordpress \
            -e MYSQL_USER=wpuser \
            -e MYSQL_PASSWORD=wppass \
            -p 3306:3306 \
            mysql:5.7

      - name: Start WordPress container
        run: |
          docker run -d --name wp-site \
            --link wp-db:mysql \
            -e WORDPRESS_DB_HOST=host.docker.internal:3306 \
            -e WORDPRESS_DB_USER=wpuser \
            -e WORDPRESS_DB_PASSWORD=wppass \
            -e WORDPRESS_DB_NAME=wordpress \
            -p 8080:80 \
            wordpress:latest

      - name: Wait for WordPress to be ready
        run: |
          echo "Waiting for WordPress to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/wp-content/ | grep -q "<title>";
            then
              echo "WordPress is ready!"
              break
            fi
            sleep 5
          done

      - name: Install Ruby and WPScan
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential libcurl4-openssl-dev zlib1g-dev
          sudo gem install wpscan

      # --- MODIFIED: Run WPScan with JSON output, handle vulnerability exit code ---
      - name: Run WPScan
        run: |
          mkdir -p scans
          set +e
          wpscan --url http://localhost:8080 \
                 --enumerate u,vp,vt \
                 --format json \
                 --no-banner \
                 --force \
                 > scans/scan-result.json 2>&1
          EXIT_CODE=$?
          echo "WPScan exit code: $EXIT_CODE"
          # Treat exit code 5 (vulnerabilities found) as normal for the scan step
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 5 ]; then
            echo "WPScan encountered an error. Output:"
            cat scans/scan-result.json
            exit $EXIT_CODE
          fi
          echo "Scan completed successfully (findings may exist)."
          set -e

      # --- NEW: Upload scan report as artifact ---
      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpscan-report
          path: scans/scan-result.json

      # --- NEW: Fail the job only if critical vulnerabilities are present ---
      - name: Fail if critical vulnerabilities found
        run: |
          if [ ! -f scans/scan-result.json ]; then
            echo "Scan result file missing – scan may have failed."
            exit 1
          fi
          CRITICAL_COUNT=$(jq '[.findings[]? | select(.severity == "critical")] | length' scans/scan-result.json)
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "Critical vulnerabilities found: $CRITICAL_COUNT"
            jq '.findings[] | select(.severity == "critical") | {title, fixed_in}' scans/scan-result.json
            exit 1
          fi
          echo "No critical vulnerabilities. Scan passed."
