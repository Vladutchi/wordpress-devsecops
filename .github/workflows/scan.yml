name: WordPress Security Scan

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  wpscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Docker network
        run: docker network create wp-net

      - name: Start MySQL container
        run: |
          docker run -d --name wp-db --network wp-net \
            -e MYSQL_ROOT_PASSWORD=rootpass \
            -e MYSQL_DATABASE=wordpress \
            -e MYSQL_USER=wpuser \
            -e MYSQL_PASSWORD=wppass \
            mysql:5.7

      - name: Start WordPress container (vulnerable version)
        run: |
          docker run -d --name wp-site --network wp-net \
            -e WORDPRESS_DB_HOST=wp-db:3306 \
            -e WORDPRESS_DB_USER=wpuser \
            -e WORDPRESS_DB_PASSWORD=wppass \
            -e WORDPRESS_DB_NAME=wordpress \
            -p 8080:80 \
            wordpress:5.8

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if docker exec wp-db mysqladmin ping -h localhost --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 5
          done
          echo "MySQL failed to start" && exit 1

      - name: Install WordPress using wp-cli
        run: |
          docker exec wp-site curl -s -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          docker exec wp-site chmod +x wp-cli.phar
          docker exec wp-site php wp-cli.phar core install \
            --url="http://localhost:8080" \
            --title="Test Site" \
            --admin_user="admin" \
            --admin_password="Admin123!" \
            --admin_email="admin@example.com" \
            --allow-root
          echo "WordPress installed successfully"

      - name: Verify WordPress is running
        run: |
          docker ps | grep wp-site || (docker logs wp-site && exit 1)
          curl -s -f http://localhost:8080 | head -20 || (echo "WordPress not reachable" && exit 1)

      - name: Prepare scans directory
        run: |
          mkdir -p ${{ github.workspace }}/scans
          chmod 777 ${{ github.workspace }}/scans

      - name: Run WPScan (allow vulnerabilities found - exit code 5)
        run: |
          set +e
          docker run --rm --network host \
            wpscanteam/wpscan \
            --url http://localhost:8080 \
            --enumerate u,vp,vt \
            --api-token ${{ secrets.WPSCAN_API_TOKEN }} \
            --format json \
            --no-banner > ${{ github.workspace }}/scans/scan-result.json 2>&1
          EXIT_CODE=$?
          echo "WPScan exit code: $EXIT_CODE"
          # Exit codes: 0=clean, 5=vulnerabilities found – both are ‘normal’ for us
          if [ $EXIT_CODE -ne 0 ] && [ $EXIT_CODE -ne 5 ]; then
            echo "WPScan encountered an error. Output:"
            cat ${{ github.workspace }}/scans/scan-result.json
            exit $EXIT_CODE
          fi
          echo "WPScan completed successfully (scan may contain vulnerabilities)"
          set -e

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpscan-report
          path: scans/scan-result.json

      - name: Fail if critical vulnerabilities found
        run: |
          if grep -q '"critical"' scans/scan-result.json; then
            echo "Critical vulnerabilities detected! Fix required."
            exit 1
          fi
          echo "No critical vulnerabilities found. Scan passed."
